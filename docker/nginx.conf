server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Streaming WebAssembly compilation requires the correct MIME type.
    types {
        application/wasm                      wasm;
        text/html                             html;
        text/javascript                       js;
        application/json                      json;
        image/png                             png;
        image/svg+xml                         svg;
        application/octet-stream              pck;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/wasm application/javascript text/javascript text/css text/html application/json image/svg+xml application/octet-stream;

    # The build is exported single-threaded, so SharedArrayBuffer and the
    # COOP/COEP header pair are deliberately NOT required. Any static host works.
    # If you ever re-export with thread support, uncomment both lines below.
    # add_header Cross-Origin-Opener-Policy   same-origin   always;
    # add_header Cross-Origin-Embedder-Policy require-corp  always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Engine payload is content-hashed per build and safe to cache hard.
    location ~* \.(wasm|pck)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
